<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="TELD — SMM, design и branding. Делаем бизнес заметным. Найдите нас в социальных сетях.">
  <title>TELD — Делаем бизнес заметным</title>
  <style>
    :root { --bg:#101010; --panel:#17191a; --white:#f7f8f8; --muted:#a7afb1; --tiffany:#69c5d5; --line:rgba(105,197,213,.28); }
    * { box-sizing:border-box; }
    html { min-height:100%; }
    body {
      margin:0; min-height:100vh; color:var(--white); background:
        radial-gradient(ellipse at 50% 35%, rgba(105,197,213,.10), transparent 38%),
        var(--bg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      display:flex; align-items:center; justify-content:center; padding:34px 20px;
    }
    .page { width:min(100%, 560px); text-align:center; }
    .logo-wrap { width:min(100%, 430px); margin:0 auto 25px; }
    .logo { display:block; width:100%; height:auto; mix-blend-mode:screen; }
    .eyebrow { color:var(--tiffany); font-size:11px; letter-spacing:.28em; font-weight:700; margin:0 0 14px; }
    h1 { font-size:clamp(29px, 7vw, 43px); line-height:1.12; letter-spacing:-.045em; margin:0; font-weight:650; }
    .tagline { color:#d5d9da; font-size:16px; margin:13px 0 34px; }
    .rule { width:54px; height:2px; background:var(--tiffany); margin:0 auto 28px; border-radius:2px; }
    .prompt { color:var(--muted); font-size:13px; margin:0 0 15px; }
    .links { display:grid; gap:12px; }
    .social {
      min-height:64px; padding:0 20px; display:flex; align-items:center; justify-content:space-between;
      text-decoration:none; color:var(--white); background:rgba(255,255,255,.035);
      border:1px solid rgba(255,255,255,.10); border-radius:14px; transition:transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .social:hover, .social:focus-visible { transform:translateY(-2px); border-color:var(--tiffany); background:rgba(105,197,213,.08); outline:none; }
    .left { display:flex; align-items:center; gap:14px; font-size:16px; font-weight:600; }
    .icon { width:34px; height:34px; display:grid; place-items:center; border-radius:10px; color:var(--tiffany); background:rgba(105,197,213,.12); }
    .icon svg { width:19px; height:19px; fill:currentColor; }
    .arrow { color:var(--tiffany); font-size:22px; }
    footer { margin-top:34px; color:#737d80; font-size:11px; letter-spacing:.12em; }
    @media (max-width:420px) { body { padding:26px 18px; } .logo-wrap { width:min(100%, 350px); margin-bottom:20px; } .tagline { margin-bottom:29px; } }
    @media (prefers-reduced-motion: reduce) { .social { transition:none; } }
  </style>
</head>
