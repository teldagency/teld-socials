<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="TELD — SMM, design и branding. Делаем бизнес заметным. Найдите нас в социальных сетях.">
  <title>TELD — Делаем бизнес заметным</title>
  <style>
    :root { --bg:#101010; --panel:#17191a; --white:#f7f8f8; --muted:#a7afb1; --tiffany:#69c5d5; --line:rgba(105,197,213,.28); }
    * { box-sizing:border-box; }
    html { min-height:100%; }
    body {
      margin:0; min-height:100vh; color:var(--white); background:
        radial-gradient(ellipse at 50% 35%, rgba(105,197,213,.10), transparent 38%),
        var(--bg);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      display:flex; align-items:center; justify-content:center; padding:34px 20px;
    }
    .page { width:min(100%, 560px); text-align:center; }
    .logo-wrap { width:min(100%, 430px); margin:0 auto 25px; }
    .logo { display:block; width:100%; height:auto; mix-blend-mode:screen; }
    .eyebrow { color:var(--tiffany); font-size:11px; letter-spacing:.28em; font-weight:700; margin:0 0 14px; }
    h1 { font-size:clamp(29px, 7vw, 43px); line-height:1.12; letter-spacing:-.045em; margin:0; font-weight:650; }
    .tagline { color:#d5d9da; font-size:16px; margin:13px 0 34px; }
    .rule { width:54px; height:2px; background:var(--tiffany); margin:0 auto 28px; border-radius:2px; }
    .prompt { color:var(--muted); font-size:13px; margin:0 0 15px; }
    .links { display:grid; gap:12px; }
    .social {
      min-height:64px; padding:0 20px; display:flex; align-items:center; justify-content:space-between;
      text-decoration:none; color:var(--white); background:rgba(255,255,255,.035);
      border:1px solid rgba(255,255,255,.10); border-radius:14px; transition:transform .2s ease, border-color .2s ease, background .2s ease;
    }
    .social:hover, .social:focus-visible { transform:translateY(-2px); border-color:var(--tiffany); background:rgba(105,197,213,.08); outline:none; }
    .left { display:flex; align-items:center; gap:14px; font-size:16px; font-weight:600; }
    .icon { width:34px; height:34px; display:grid; place-items:center; border-radius:10px; color:var(--tiffany); background:rgba(105,197,213,.12); }
    .icon svg { width:19px; height:19px; fill:currentColor; }
    .arrow { color:var(--tiffany); font-size:22px; }
    footer { margin-top:34px; color:#737d80; font-size:11px; letter-spacing:.12em; }
    @media (max-width:420px) { body { padding:26px 18px; } .logo-wrap { width:min(100%, 350px); margin-bottom:20px; } .tagline { margin-bottom:29px; } }
    @media (prefers-reduced-motion: reduce) { .social { transition:none; } }
  </style>
</head>
<body>
  <main class="page">
    <div class="logo-wrap">
    <img class="logo" src="logo.png" alt="Логотип TELD">
</div>
    <p class="eyebrow">SMM&nbsp; • &nbsp;DESIGN&nbsp; • &nbsp;BRANDING</p>
    <h1>Делаем бизнес<br>заметным</h1>
    <p class="tagline">Выберите удобную социальную сеть</p>
    <div class="rule"></div>
    <nav class="links" aria-label="Социальные сети TELD">
      <a class="social" href="https://vk.ru/teld_agency_news" target="_blank" rel="noopener noreferrer">
        <span class="left"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.8 18.2h1.4s.4 0 .6-.3c.2-.2.2-.7.2-.7s0-2.1 1-2.4c1-.3 2.3 2 3.7 2.9 1 .7 1.7.5 1.7.5l3.4-.1s1.8-.1.9-1.5c-.1-.1-.6-1.1-3-3.1-2.5-2.1-2.1-1.8.8-5.6 1.8-2.3 2.5-3.7 2.3-4.3-.2-.5-1.3-.4-1.3-.4l-3.8.1s-.3 0-.5.1-.3.3-.3.3-.6 1.7-1.4 3.1c-1.7 2.9-2.4 3.1-2.7 2.9-.7-.4-.5-1.7-.5-2.6 0-2.8.4-4-.8-4.3-.4-.1-.7-.2-1.8-.2-1.4 0-2.6 0-3.3.3-.5.2-.9.7-.7.7.2 0 .7.1 1 .5.4.5.4 1.6.4 1.6s.2 3.1-.5 3.5c-.5.3-1.2-.3-2.7-2.9-.8-1.4-1.4-3-1.4-3s-.1-.3-.3-.4c-.2-.2-.6-.3-.6-.3l-3.6.1s-.6 0-.8.3c-.2.3 0 .8 0 .8s2.8 6.6 6 9.9c2.9 3 6.2 2.8 6.2 2.8z"/></svg></span>ВКонтакте</span><span class="arrow">↗</span>
      </a>
      <a class="social" href="https://t.me/Teld_agency_news" target="_blank" rel="noopener noreferrer">
        <span class="left"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.8 4.2 18.5 20c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6 13.6 1 12c-1.1-.3-1.1-1 .2-1.5L20.5 3c.9-.3 1.7.2 1.3 1.2z"/></svg></span>Telegram</span><span class="arrow">↗</span>
      </a>
      <a class="social" href="https://www.instagram.com/teld_agency/" target="_blank" rel="noopener noreferrer">
        <span class="left"><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.2-3.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/></svg></span>Instagram</span><span class="arrow">↗</span>
      </a>
    </nav>
    <footer>Будем рады видеть вас в наших соцсетях</footer>
  </main>
</body>
</html>
